#
# Stereo to mono downmix for devices whose single speaker is wired to one
# channel. Enabled per device with DEVICE_MONO_SPEAKER_SINK, see 050-audio.
# @SINK@ is the node.name of the hardware sink. Only that sink is affected.

wireplumber.profiles = {
  main = {
    node.software-dsp = required
  }
}

node.software-dsp.rules = [
  {
    matches = [
      {
        node.name = "@SINK@"
      }
    ]
    actions = {
      create-filter = {
        hide-parent = true
        filter-graph = {
          node.description = "Internal Speaker"
          filter.graph = {
            nodes = [
              { type = builtin name = copyL label = copy }
              { type = builtin name = copyR label = copy }
              { type = builtin name = mixL label = mixer control = { "Gain 1" = 0.5 "Gain 2" = 0.5 } }
              { type = builtin name = mixR label = mixer control = { "Gain 1" = 0.5 "Gain 2" = 0.5 } }
            ]
            links = [
              { output = "copyL:Out" input = "mixL:In 1" }
              { output = "copyR:Out" input = "mixL:In 2" }
              { output = "copyL:Out" input = "mixR:In 1" }
              { output = "copyR:Out" input = "mixR:In 2" }
            ]
            inputs  = [ "copyL:In" "copyR:In" ]
            outputs = [ "mixL:Out" "mixR:Out" ]
          }
          capture.props = {
            node.name      = "mono_speaker"
            media.class    = "Audio/Sink"
            audio.position = [ FL FR ]
          }
          playback.props = {
            node.name         = "mono_speaker.output"
            audio.position    = [ FL FR ]
            target.object     = "@SINK@"
            node.passive      = true
            stream.dont-remix = true
          }
        }
      }
    }
  }
]
